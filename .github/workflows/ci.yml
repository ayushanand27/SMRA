name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r smra/requirements.txt
          python -m pip install -r smra/requirements-dev.txt

      - name: Ruff lint
        run: ruff check smra tests

      # smra/data/smra.db is git-ignored (regenerated, not committed) -- tests/test_db.py
      # depends on it being present, matching the README's documented local setup step.
      - name: Seed SQLite fallback DB
        run: python smra/data/load_db.py --db smra/data/smra.db --set-columns

      # Floor set below the current measured baseline (~40%) so it fails on regressions
      # without blocking today's merges; raise it as real coverage grows.
      - name: Pytest with coverage
        run: pytest --cov=smra --cov-report=term-missing --cov-report=xml --cov-fail-under=35

      - name: Offline evals (routing + guardrails)
        run: python -m smra.eval.run_eval --threshold 0.7

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Report-only for now: known CVEs exist in transitive deps (pypdf, pillow, aiohttp,
      # langchain-core, transformers) whose fixes require untested major-version bumps.
      # See README Known Limitations. Flip to a hard failure once those are cleared.
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r smra/requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
